<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>
  <main class="catalog">
    <div class="container catalog__container">

      <h1 class="title catalog__title">Выбери свой продукт</h1>
      <button id="change-all-cards-color-button">Изменить цвет всех карточек</button>
      <button id="change-first-card-color-button">Изменить цвет первой карточки</button>
      <button id="open-google-button">Открыть Google</button>
      <button id="output-console-log-button">Вывести сообщение в консоль блок</button>
      <button id="color-toggle-button">Переключить цвет кнопки</button>

      <ul class= "products"></ul>

      <template id="product-template">
        <li class="products__item card">
          <img class="card__image" src="" alt="">
          <span class="card__category"></span>
          <h2 class="card__name"></h2>
          <p class="card__description"></p>

          <div class="card__compound compound">
            <span class="compound__name">Состав:</span>
            <ul class="compound__list"></ul>
          </div>

          <div class="card__price">
            <b>Цена:</b>
            <span></span>
          </div>
        </li>
      </template>
    </div>
  </main>
  <script src="js/main.js"></script>
  <script src="js/homework-7.js"></script>
  <script src="js/homework-8.js"></script>
  <script type="module" src="js/homework-9.js"></script>
  <script type="module" src="js/homework-10.js"></script>
</body>
</html>
