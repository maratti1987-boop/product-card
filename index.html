<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>
  <main class="catalog">
    <div class="container catalog__container">

      <h1 class="title catalog__title">Выбери свой продукт</h1>
      <!--
      <button id="change-all-cards-color-button">Изменить цвет всех карточек</button>
      <button id="change-first-card-color-button">Изменить цвет первой карточки</button>
      <button id="open-google-button">Открыть Google</button>
      <button id="output-console-log-button">Вывести сообщение в консоль блок</button>
      <button id="color-toggle-button">Переключить цвет кнопки</button>
      -->

      <ul class="products" id="products"></ul>

      <template id="product-template">
        <li class="products__item card">
          <img class="card__image" src="" alt="">
          <span class="card__category"></span>
          <h2 class="card__name"></h2>
          <p class="card__description"></p>

          <div class="card__compound compound">
            <span class="compound__name">Состав:</span>
            <ul class="compound__list"></ul>
          </div>

          <div class="card__price">
            <b>Цена:</b>
            <span></span>
          </div>
        </li>
      </template>
    </div>
  </main>
  <!--
  <script src="js/main.js"></script>
  <script src="js/homework-7.js"></script>
  <script src="js/homework-8.js"></script>
  <script type="module" src="js/homework-9.js"></script>
      -->
  <script type="module" src="js/homework-10.js"></script>
  <script type="module" src="js/homework-11.js"></script>

  <footer class="footer">

    <div class="footer__top">

      <div class="footer__brand">
        <h2 class="footer__brand-title">Product Card</h2>
        <p class="footer__brand-description">У нас самые лучшие продукты для кожи!</p>

        <div class="footer__social">
          <a class="footer__social-link" href="#" target="_blank" rel="noopener">
            <img src="Images/Telegram-icon.png" alt="Telegram">
          </a>

          <a class="footer__social-link" href="#" target="_blank" rel="noopener">
            <img src="Images/VK-icon.png" alt="VK">
          </a>
        </div>
      </div>

      <div class="footer__subscribe">
        <h3 class="footer__subscribe-title">Подпишись на наши акции</h3>

        <form id="subscribe-form">
          <label for="emailInput">Email</label>
          <input class="footer__subscribe-input"
            type="email" 
            id="emailInput" 
            name="email" 
            placeholder="Введи Email..." 
            required>
          <button class="footer__subscribe-button" 
            type="submit">Подписаться</button>
        </form>
      </div>

      <nav class="footer__nav">
        <h3 class="footer__nav-title">Быстрые ссылки</h3>
        <ul class="footer__list">
          <li class="footer__list-item"><a href="#">Главная</a></li>
          <li class="footer__list-item"><a href="#">Магазин</a></li>
          <li class="footer__list-item"><a href="#">Контакты</a></li>
        </ul>
      </nav>
    </div>

    <div class="footer__bottom">
      <p class="footer__bottom-text">www.product-cards.com © all right reserve</p>
    </div>
  </footer>

  <button id="openModalBtn" class="footer__register-btn">Регистрация</button>

  <div class="overlay" id="overlay"></div>
  <div class="modal" id="modal">

    <button class="modal__close" id="closeModalBtn">×</button>

    <h2 class="modal__title">Регистрация</h2>
    <form class="modal__form" id="registrationForm">
      
      <label for="firstName">Имя</label>
      <input 
        type="text" 
        id="firstName" 
        name="firstName"
        placeholder="Введите имя"
        required>

      <label for="lastName">Фамилия</label>
      <input 
        type="text" 
        id="lastName" 
        name="lastName"
        placeholder="Введите фамилию"
        required>

      <label for="birthDate">Дата рождения</label>
      <input 
        type="date" 
        id="birthDate" 
        name="birthDate"
        required>

      <label for="login">Логин</label>
      <input 
        type="text" 
        id="login"
        name="login"
        placeholder="Введите логин"
        required>

      <label for="password">Пароль</label>
      <input 
        type="password" 
        id="password" 
        name="password" 
        placeholder="Введите пароль"
        required
        minlength="6">

      <label for="repeatPassword">Повторите пароль</label>
      <input
        type="password"
        id="repeatPassword"
        name="repeatPassword"
        placeholder="Повторите пароль"
        required
        minlength="6"
      >

      <button type="submit">Зарегистрироваться</button>

    </form>
  </div>
</body>
</html>
